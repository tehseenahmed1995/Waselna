# nginx config for the Waselna Web_Client SPA.
# Serves the static bundle and falls back to index.html for client-side routing.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Long-cache the hashed asset bundles.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # SPA fallback: every unknown path serves index.html so the client router
    # can resolve it.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # A lightweight liveness path for the ALB target group health check.
    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok";
    }
}