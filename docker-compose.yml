# Local_Dev_Environment (Requirement 24).
#
# Exactly six services: frontend, backend, queue-worker, reverb, postgres,
# redis (Requirement 24.1). Application source is bind-mounted so a source
# change takes effect without an image rebuild (Requirement 24.3). PostgreSQL
# and Redis data live in the named volumes `pgdata` and `redisdata`, never in a
# container filesystem layer, so removing and recreating a container preserves
# every committed row (Requirements 24.4, 24.5).
#
# Every environment-specific value is interpolated from the environment file
# (Requirement 24.6), which is `backend/.env` — the single env file of the
# Platform. Run every compose command with it:
#
#   docker compose --env-file ./backend/.env up -d
#
# See docs/architecture/local.md for the documented start, migrate, seed, and
# test commands.

name: waselna

x-backend: &backend
  build:
    context: .
    dockerfile: docker/backend/Dockerfile
  env_file:
    - ./backend/.env
  volumes:
    - ./backend:/var/www/html
  depends_on:
    postgres:
      condition: service_healthy
    redis:
      condition: service_healthy

services:
  # Web_Client: the Vite development server.
  frontend:
    image: node:22-alpine
    working_dir: /app
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0 --port 5173"
    environment:
      VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:8000/api/v1}
      VITE_REVERB_APP_KEY: ${REVERB_APP_KEY}
      VITE_REVERB_HOST: ${VITE_REVERB_HOST:-localhost}
      VITE_REVERB_PORT: ${REVERB_PORT:-8080}
      VITE_REVERB_SCHEME: ${REVERB_SCHEME:-http}
    volumes:
      - ./frontend:/app
    ports:
      - "${FRONTEND_PORT:-5173}:5173"
    depends_on:
      - backend

  # Delivery_API: the HTTP process. OPcache (enabled in the image) removes the
  # per-request recompile cost; a single served request is then a few
  # milliseconds, which the SPA's handful of parallel calls tolerate well. The
  # PHP built-in server's experimental multi-worker mode is deliberately not
  # used — it deadlocks under concurrent load on this platform.
  backend:
    <<: *backend
    command: serve-http
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    healthcheck:
      # A lightweight probe that does not spawn a PHP process (which would
      # compete with the single-worker dev server for the request slot). busybox
      # wget ships in the alpine base image.
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1:8000/api/v1/health"]
      interval: 30s
      timeout: 5s
      retries: 10
      start_period: 90s

  # Queue_Worker: the documented queue names of Requirement 21.5.
  queue-worker:
    <<: *backend
    command: php artisan queue:work --queue=default,notifications,payments,dispatch,reports --tries=3

  # Realtime_Gateway: Laravel Reverb. The `reverb:start` command becomes
  # available with the Realtime_Gateway task that installs laravel/reverb.
  reverb:
    <<: *backend
    command: php artisan reverb:start --host=0.0.0.0 --port=8080
    ports:
      - "${REVERB_PORT:-8080}:8080"

  postgres:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_DB: ${DB_DATABASE}
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "${DB_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes
    volumes:
      - redisdata:/data
    ports:
      - "${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  pgdata:
  redisdata:
